# ============================================================
#  LifestealPowers config
#  After editing, run  /powers reload  in game (or restart).
#  "level" 1 = the normal potion level, 2 = level II, etc.
#  Times are in SECONDS. Distances are in BLOCKS.
#  Set enabled: false to remove a power from the game
#  (nobody will be given it and it can't be used).
# ============================================================

hearts:
  max-hearts: 20          # most hearts anyone can reach from lifesteal
  min-hearts: 1           # nobody can drop below this many hearts
  hearts-per-kill: 1      # hearts stolen per player kill
  dragon-egg-bonus: 30    # extra hearts for whoever holds the dragon egg

# ---------------- BENDING FOR EVERYONE ----------------
# Every player gets one bending ability (Fire, Water, Earth or Air) AND one unique power.
# Bending abilities are shared (many players can be firebenders), are kept when you die,
# and the game hands out whichever element the fewest players have. The Omni Bender stays
# one-of-a-kind (found like any other unique power) and already includes all four elements.
bending:
  give-everyone: true

powers:
  # ---------------- ACTIVE (right-click the Power Core) ----------------
  DASH:
    enabled: true
    cooldown: 5
    strength: 2.2         # how hard you launch forward
    lift: 0.4             # upward boost
  LEAP:
    enabled: true
    cooldown: 5
    height: 1.6           # upward speed
    slow-fall-seconds: 2
  FIREBALL:
    enabled: true
    cooldown: 7
    explosion-power: 10    # 1 = small, 4 = TNT-sized
  LIGHTNING:
    enabled: true
    cooldown: 15
    range: 80
  FREEZE:
    enabled: true
    cooldown: 15
    radius: 8
    duration: 10
    level: 6              # slowness level
  HEAL:
    enabled: true
    cooldown: 20
    duration: 5
    level: 10              # regeneration level
  TELEPORT:
    enabled: true
    cooldown: 15
    range: 50
  SHOCKWAVE:
    enabled: true
    cooldown: 15
    radius: 10
    strength: 5
  INVISIBILITY:
    enabled: true
    cooldown: 40
    duration: 20
  SPEED_BURST:
    enabled: true
    cooldown: 60
    duration: 30
    level: 10
  STRENGTH_SURGE:
    enabled: true
    cooldown: 60
    duration: 10
    level: 5
  SHIELD:
    enabled: true
    cooldown: 60
    duration: 10
    resistance-level: 10
    absorption-level: 10
  BLINDING_FLASH:
    enabled: true
    cooldown: 25
    radius: 10
    duration: 10
  WITHER_TOUCH:
    enabled: true
    cooldown: 30
    radius: 6
    duration: 10
    level: 6
  VOID_PULL:
    enabled: true
    cooldown: 20
    radius: 12
    strength: 2.4
  ARROW_STORM:
    enabled: true
    cooldown: 20
    arrows: 30
    speed: 15
  TNT_THROW:
    enabled: true
    cooldown: 25
    fuse-seconds: 1
    speed: 10
  SWAP:
    enabled: true
    cooldown: 30
    range: 25

  # ---------------- PASSIVE (always on) ----------------
  NIGHT_EYES:
    enabled: true
  WATER_LORD:
    enabled: true
  FIRE_WALKER:
    enabled: true
  HASTE_MINER:
    enabled: true
    level: 10
  FEATHER_FALL:
    enabled: true
  LUCKY_CHARM:
    enabled: true
    level: 100000         # potion levels above 255 are capped at 255

  # ---------------- BENDING POWERS ----------------
  # Each bender power gives you its moves. Switch moves with sneak + right-click on the Power Core.
  # Every bender also gets a small always-on bonus (fire immunity, water breathing, etc).
  FIREBENDER:
    enabled: true
  WATERBENDER:
    enabled: true
  EARTHBENDER:
    enabled: true
  AIRBENDER:
    enabled: true
  OMNI_BENDER:            # the best power: ALL eight moves + Avatar State, and every move is stronger
    enabled: true
    boost: 1.5            # multiplies damage, range and strength of every move

  # --- fire moves ---
  FIRE_BLAST:             # stream of fire in front of you
    cooldown: 8
    range: 15
    damage: 6
    fire-seconds: 5
  FLAME_RING:             # ring of flames around you
    cooldown: 15
    radius: 6
    damage: 4
    fire-seconds: 5
  # --- water moves ---
  TIDAL_WAVE:             # wave that shoves enemies away and slows them
    cooldown: 12
    range: 10
    strength: 2
    damage: 3
    duration: 4           # slowness seconds
    level: 3
  WATER_HEAL:             # heal yourself and put out fire
    cooldown: 25
    heal: 8               # health points (8 = 4 hearts)
    duration: 8           # regeneration seconds
    level: 2
  # --- earth moves ---
  EARTH_SPIKE:            # hits the first enemy you aim at and launches them up
    cooldown: 10
    range: 12
    damage: 7
    lift: 1.2
  STONE_WALL:             # temporary wall of stone in front of you
    cooldown: 20
    distance: 3
    half-width: 2         # 2 = a wall 5 blocks wide
    height: 3
    duration: 8           # seconds before the wall disappears
  # --- air moves ---
  AIR_BLAST:              # gust that knocks enemies away
    cooldown: 8
    range: 12
    strength: 3
  AIR_GLIDE:              # shoot up and glide fast
    cooldown: 15
    lift: 1.0
    duration: 8
    level: 2
  # --- omni bender only ---
  AVATAR_STATE:
    cooldown: 90
    duration: 15
    level: 3              # speed / strength level (resistance is one lower)
    radius: 8
    damage: 6

  # ---------------- DRAGON EGG POWERS ----------------
  # These are NOT handed out or stolen. Whoever has the dragon egg in their
  # inventory gets them, and loses them when the egg leaves their inventory.
  DRAGON_FLIGHT:          # passive: fly like in creative mode
    enabled: true
    speed: 0.1            # flying speed (0.1 = normal creative flight, max 1.0)
  DRAGON_BREATH:          # active: shows up in the Power Core cycle (sneak + right-click)
    enabled: true
    cooldown: 15
    range: 8              # how far in front of you the cloud appears
    radius: 4             # size of the cloud
    duration: 8           # how long the cloud lasts
    damage: 2             # damage dealt every 0.5s to everything inside (2 = 1 heart). You are never hurt by your own cloud.

# ---------------- WITHDRAWING ----------------
# /withdrawheart [amount]  -> turns your hearts into Heart items
# /withdrawpower <power>   -> turns one of your powers into a Power Crystal
withdraw:
  hearts: true
  powers: true

# ---------------- CRAFTING RECIPES ----------------
# shape = 3 rows of 3 letters (use a space for an empty slot)
# ingredients = what each letter means (any Minecraft item name)
# Run /powers reload after changing these.
recipes:
  # Heart: right-click to gain 1 heart
  heart:
    enabled: true
    shape:
      - "DTD"
      - "NSN"
      - "DTD"
    ingredients:
      D: DIAMOND_BLOCK
      T: TOTEM_OF_UNDYING
      N: NETHERITE_INGOT
      S: NETHER_STAR
  # Power Crystal: right-click to gain a random unclaimed power
  power-crystal:
    enabled: true
    shape:
      - "DSD"
      - "NAN"
      - "DSD"
    ingredients:
      D: DIAMOND_BLOCK
      S: NETHER_STAR
      N: NETHERITE_INGOT
      A: ENCHANTED_GOLDEN_APPLE

# ---------------- ONE MACE ----------------
# Only one mace can ever be crafted. Maces from chests and vaults are removed.
# If the mace gets lost (void, etc.) an admin can run  /ls mace reset  so it can be crafted again.
mace:
  only-one: true

# ---------------- NO NETHERITE ARMOR ----------------
# Netherite tools and ingots still work. Netherite armor can't be made or found, and any that
# already exists is turned back into diamond armor (you get the netherite ingots back).
netherite:
  disable-armor: true

# ---------------- EXPLOSIONS ----------------
# disable-end-crystal: crystals can still be destroyed (so the dragon fight works) but their blast
#                      does no damage to players and breaks no blocks.
# disable-respawn-anchor: anchors can't be used outside the Nether, so they can never explode.
explosions:
  disable-end-crystal: true
  disable-respawn-anchor: true
